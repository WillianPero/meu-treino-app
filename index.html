<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0c0e11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu Treino">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1eb;--card:#fffefb;--ink:#15171b;--mute:#6c7078;--line:#e4dfd4;--acc:#15171b;--accink:#f4f1eb;--gold:#a97f35;--ok:#1f8a5b;--sh:0 1px 2px rgba(20,18,12,.05),0 10px 26px -14px rgba(20,18,12,.22);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0e11;--card:#15181d;--ink:#f2eee5;--mute:#8b9098;--line:#252932;--acc:#d6b46c;--accink:#15110a;--gold:#d6b46c;--ok:#47c18a;--sh:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -16px rgba(0,0,0,.8)}}
:root[data-theme="dark"]{--bg:#0c0e11;--card:#15181d;--ink:#f2eee5;--mute:#8b9098;--line:#252932;--acc:#d6b46c;--accink:#15110a;--gold:#d6b46c;--ok:#47c18a;--sh:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -16px rgba(0,0,0,.8)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(700px 320px at 90% -8%,color-mix(in srgb,var(--gold) 16%,transparent),transparent)}
main{position:relative;max-width:580px;margin:0 auto;padding:22px 16px 110px}
h1{font:700 30px/1 "Barlow Condensed",Impact,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin:6px 0 16px}
h1::before{content:"";display:block;width:36px;height:3px;border-radius:2px;background:var(--gold);margin-bottom:12px}
.sub{color:var(--mute);margin:0 0 16px}
.sec{font:600 12.5px Barlow,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:26px 0 10px}
.meta{color:var(--mute);font-size:14px}.meta b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.tab{flex:1 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;font:600 15px Barlow,sans-serif;cursor:pointer;text-align:left;box-shadow:var(--sh);transition:transform .15s,background .2s}
.tab:active{transform:scale(.97)}
.tab small{display:block;font-weight:400;color:var(--mute);font-size:12.5px}
.tab[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.tab[aria-selected=true] small{color:inherit;opacity:.8}
.prog{margin:18px 0 14px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--ok));border-radius:6px;transition:width .4s}
.prog p{margin:7px 0 0;color:var(--mute);font-size:13.5px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:15px;margin-bottom:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.ex input{appearance:none;-webkit-appearance:none;width:28px;height:28px;margin:2px 0 0;border:2px solid var(--line);border-radius:9px;display:grid;place-content:center;grid-row:span 4;cursor:pointer;background:var(--bg);transition:background .2s,border-color .2s}
.ex input:checked{background:var(--ok);border-color:var(--ok)}
.ex input:checked::after{content:"";width:11px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.ex h2{font:700 23px/1.1 "Barlow Condensed",Impact,sans-serif;letter-spacing:.02em;margin:0}
.ex h2 em{font-style:normal;color:var(--gold);margin-right:8px;font-size:18px}
.ex.done h2{text-decoration:line-through;color:var(--mute)}
.vid{display:inline-block;margin-top:8px;background:var(--acc);color:var(--accink);text-decoration:none;font-weight:600;font-size:14px;padding:9px 15px;border-radius:12px;justify-self:start;letter-spacing:.02em;transition:transform .15s}
.vid:active{transform:scale(.97)}
.vid:focus-visible,.tab:focus-visible,.reset:focus-visible,input:focus-visible,.chip:focus-visible,.big:focus-visible,.modo button:focus-visible,.sr:focus-visible,#timer button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.reset{background:none;border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:8px 13px;font:600 14px Barlow,sans-serif;cursor:pointer;transition:background .15s}
.reset:active{background:var(--line)}
.reset:disabled{opacity:.45;cursor:default}
.series{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sr{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:11px;padding:7px 13px;font:600 14px Barlow,sans-serif;cursor:pointer;transition:background .2s}
.sr[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
#timer{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:18px;background:var(--acc);color:var(--accink);box-shadow:0 16px 40px -12px rgba(0,0,0,.5)}
#timer[hidden]{display:none}
#timer b{font:700 34px "Barlow Condensed",sans-serif;margin-left:10px;letter-spacing:.04em}
#timer.fim{background:var(--ok);color:#fff}
#timer button{border:0;border-radius:11px;padding:9px 15px;font:600 14px Barlow,sans-serif;cursor:pointer;background:var(--bg);color:var(--ink)}
.modo{display:flex;gap:4px;margin:0 0 14px;padding:4px;background:var(--line);border-radius:14px}
.modo button{flex:1;border:0;background:transparent;color:var(--mute);border-radius:11px;padding:10px;font:700 17px "Barlow Condensed",Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .2s}
.modo button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 13px;font:500 14px Barlow,sans-serif;cursor:pointer;transition:background .2s}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.big{display:block;width:100%;text-align:left;padding:20px 18px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);box-shadow:var(--sh);font:700 30px/1.1 "Barlow Condensed",Impact,sans-serif;letter-spacing:.03em;text-transform:uppercase;margin-bottom:12px;cursor:pointer;transition:transform .15s}
.big:active{transform:scale(.985)}
.big::after{content:"→";float:right;color:var(--gold)}
.big small{display:block;font:400 14px Barlow,sans-serif;letter-spacing:0;text-transform:none;color:var(--mute);margin-top:6px}
.big.pri{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.big.pri::after{color:inherit}
.big.pri small{color:inherit;opacity:.78}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:12px 14px;margin-bottom:10px}
.row b{font-weight:600}
.row span{display:block;color:var(--mute);font-size:14px}
.row .reset{margin:0;flex:none}
.stp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stp button:not(.reset){width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 18px Barlow,sans-serif;cursor:pointer}
.stp span{display:inline;color:var(--ink);min-width:64px;text-align:center;font-size:14px}
.stp input,.stp select,.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:11px;padding:9px;background:var(--bg);color:var(--ink);font:400 16px Barlow,sans-serif}
.stp input{width:84px;padding:7px;font-size:15px}
.stp select{padding:7px;font-size:14px;font-weight:500}
.vl{flex-basis:100%;width:100%;border:1px solid var(--line);border-radius:11px;padding:8px 10px;background:var(--bg);color:var(--ink);font:400 14px Barlow,sans-serif}
.form{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:14px;display:grid;gap:9px}
.form input,.form select,.form textarea{width:100%}
.form textarea{min-height:110px}
.tag{display:inline-block;padding:1px 9px;border-radius:12px;font-size:12px;font-weight:600;margin-left:6px}
.row .tag{display:inline-block;color:var(--ink);background:var(--line)}
.row .tag.ok{background:var(--ok);color:#fff}
.lk{color:var(--gold);font-size:14px;font-weight:600}
.vazio{color:var(--mute);padding:10px 0}
.parab{background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 24%,var(--card)),var(--card));border:1px solid var(--gold);border-radius:22px;box-shadow:var(--sh);padding:22px 16px;text-align:center;margin:0 0 16px;animation:pop .55s cubic-bezier(.2,1.3,.4,1)}
.parab .mk{width:58px;height:58px;margin:0 auto;border-radius:50%;background:var(--gold);color:var(--accink);display:grid;place-content:center;font:700 30px/1 Barlow,sans-serif}
.parab h2{font:700 28px/1.1 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:12px 0 4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:16px 0 12px}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px 6px}
.stats b{display:block;font:700 26px/1.1 "Barlow Condensed",Impact,sans-serif;letter-spacing:.02em}
.stats span{font-size:12.5px;color:var(--mute)}
.parab label input{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--bg);color:var(--ink);font:400 16px Barlow,sans-serif;margin-left:6px}
@keyframes pop{from{opacity:0;transform:scale(.93) translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.parab{animation:none}}
</style>
</head>

function met(n){n=n.toLowerCase();
if(/pular corda|corda naval/.test(n))return 11;
if(/corrida|tiros|hiit|air bike|simulador de escada|intervalos/.test(n))return 9;
if(/burpee|polichinelo|salto|skater|pulo|escalador|mountain|boxe|joelho alto|chute|marcha acelerada|calcanhar/.test(n))return 8;
if(/remo ergom/.test(n))return 7;
if(/inclinad|ladeira|subida/.test(n)&&/caminhada|bicicleta/.test(n))return 6;
if(/bicicleta|spinning|transport|el[ií]ptico/.test(n))return 6;
if(/caminhada/.test(n))return 4.5;
return 5}
function parseEx(x){var d=x[1],m=d.match(/^(\d+) ×\s*(.*)$/),s=m?+m[1]:1,r=m?m[2]:d,t,card=false,mm=r.match(/(\d+)\s*min/),ss=r.match(/(\d+)\s*s\b/),rp=r.match(/^(\d+)/);
if(mm){t=+mm[1]*60;card=true}else if(ss){t=+ss[1]}else if(rp){t=+rp[1]*3}else{t=40}
if(/por (perna|lado)/i.test(r)){t*=2}
return {s:s,t:t,card:card}}
function estima(c,peso){var seg=0,kcal=0,E=c.e;
E.forEach(function(x,i){var p=parseEx(x),act=p.s*p.t,ult=i===E.length-1,desc=(p.card?0:(p.s-(ult?1:0))*60)+(ult?0:30);
seg+=act+desc;kcal+=met(x[0])*peso*act/3600+2*peso*desc/3600});
return {min:Math.max(1,Math.round(seg/60)),kcal:Math.round(kcal)}}
